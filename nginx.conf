server {
    listen 80;
    server_name localhost;

    # Carga de la aplicación React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Redirección al microservicio de Ventas
    location /api/v1/ventas {
        proxy_pass http://10.0.3.17:8082/api/v1/ventas;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Redirección al microservicio de Despachos
    location /api/v1/despachos {
        proxy_pass http://10.0.3.17:8081/api/v1/despachos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}