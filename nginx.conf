server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

# Redirección explícita para el microservicio de Ventas
location /api/v1/ventas {
    proxy_pass http://10.0.3.17:8082/api/v1/ventas;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
    # Tiempos de espera cortos para que no se quede congelado si falla
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}

# Redirección explícita para el microservicio de Despachos
location /api/v1/despachos {
    proxy_pass http://10.0.3.17:8081/api/v1/despachos;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
}