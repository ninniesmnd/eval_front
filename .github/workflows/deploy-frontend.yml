name: Deploy Frontend a AWS (ECR)

on:
  push:
    branches:
      - deploy  # se ejecuta con cambios en la rama deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    # credenciales de AWS
    - name: Configurar credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1  # region aws

    # iniciar sesión
    - name: Iniciar sesión en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    # imagen del front
    - name: Construir y subir Imagen del Frontend
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: true
        # 
        tags: ${{ steps.login-ecr.outputs.registry }}/front-despacho:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
    - name: Desplegar en AWS EC2 Pública vía SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.AWS_EC2_PUBLIC_HOST }} # ec2 ip publica
        username: ec2-user
        key: ${{ secrets.AWS_EC2_SSH_KEY }}
        script: |
          export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          export AWS_DEFAULT_REGION=us-east-1

          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ECR_REGISTRY }}

          docker stop front-despacho-container || true
          docker rm front-despacho-container || true

          docker pull ${{ secrets.AWS_ECR_REGISTRY }}/front-despacho:latest

          docker run -d \
            --name front-despacho-container \
            -p 80:80 \
            --restart always \
            ${{ secrets.AWS_ECR_REGISTRY }}/front-despacho:latest
          
          docker image prune -f